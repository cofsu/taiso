<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おうち体操</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F6F5;--card:#fff;--ink:#1E2B29;--sub:#5E7270;--line:#D5E0DE;--pri:#1F7A6D;--priInk:#fff;--maru:#D8432F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A19;--card:#1B2625;--ink:#E9F1F0;--sub:#9DB2AF;--line:#2C3B39;--pri:#4DB8A8;--priInk:#08201C;--maru:#F2705C}}
:root[data-theme="dark"]{--bg:#121A19;--card:#1B2625;--ink:#E9F1F0;--sub:#9DB2AF;--line:#2C3B39;--pri:#4DB8A8;--priInk:#08201C;--maru:#F2705C}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-weight:500;font-size:18px;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;font-weight:900;margin:8px 0 2px}
h2{font-size:22px;font-weight:900;margin:4px 0 12px}
.sub{color:var(--sub);font-size:15px;margin:0}
button,a.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:var(--priInk);font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px}
:focus-visible{outline:3px solid var(--maru);outline-offset:2px}
.today{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.bigmaru{width:72px;height:72px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;color:var(--ink);min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:20px;font-weight:900;line-height:1.3}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pri)}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.item.done{border-color:var(--maru)}
.item h3{margin:0 0 4px;font-size:20px;font-weight:900}
.video{aspect-ratio:16/9;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;margin:10px 0;overflow:hidden;width:100%}
.video video{width:100%;height:100%;background:#000}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{width:100%;min-height:60px;border-radius:16px;border:2px dashed var(--maru);background:transparent;color:var(--maru);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.check.on{background:var(--maru);color:#fff;border-style:solid}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-height:64px;border:0;background:none;color:var(--sub);font-weight:700;font-size:14px}
.nav button.on{color:var(--pri)}
.nav svg{display:block;margin:0 auto 2px}
.back{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 0;min-height:44px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:13px;color:var(--sub)}
.cal .d{aspect-ratio:1;position:relative;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px}
.cal .d.t{background:var(--card);outline:2px solid var(--pri)}
.cal .d span{position:absolute;top:2px;left:5px;font-size:11px;color:var(--sub)}
.stats{display:flex;gap:12px;margin:14px 0}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stats b{font-size:28px;font-weight:900;display:block;line-height:1.2}
input,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 8px}
label{font-size:13px;color:var(--sub)}
.foot{text-align:center;margin-top:24px}
.foot button{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;min-height:44px}
.note{font-size:13px;color:var(--sub);margin-top:8px}input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--pri)}.sel{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--ink);font-weight:700;margin-bottom:10px}.caution{margin-top:28px;padding:14px 16px;border-radius:14px;border:2px solid var(--maru);background:var(--card);font-size:16px}.caution b{display:block;font-size:15px;color:var(--maru)}textarea#lk{font-size:13px;word-break:break-all}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<script>
const KEY="taiso-app-v1";
const DEF=[
{id:"leg",name:"足のトレーニング",items:[
{name:"いすからの立ち座り",reps:"10回 × 2セット",desc:"いすに浅く座り、ゆっくり立ち上がってゆっくり座ります。"},
{name:"かかと上げ",reps:"15回 × 2セット",desc:"いすの背につかまり、かかとをゆっくり上げ下げします。"},
{name:"座って膝のばし",reps:"左右10回ずつ",desc:"座ったまま膝をのばし、3秒止めてからゆっくり戻します。"}]},
{id:"hip",name:"お尻トレーニング",items:[
{name:"お尻上げ(ブリッジ)",reps:"10回 × 2セット",desc:"仰向けで膝を立て、お尻をゆっくり持ち上げます。"},
{name:"横向きで脚開き",reps:"左右10回ずつ",desc:"横向きで膝を曲げ、足をつけたまま上の膝を開きます。"},
{name:"四つ這いで脚上げ",reps:"左右10回ずつ",desc:"四つ這いから片脚を後ろへゆっくり持ち上げます。"}]},
{id:"pelvis",name:"骨盤体操",items:[
{name:"座って骨盤前後",reps:"10往復",desc:"いすに座り、骨盤を前後にゆっくり傾けます。"},
{name:"仰向け膝倒し",reps:"左右10回ずつ",desc:"仰向けで膝を立て、両膝を左右にゆっくり倒します。"},
{name:"骨盤まわし",reps:"左右5周ずつ",desc:"座って骨盤で円を描くように大きく回します。"}]},
{id:"walk",name:"歩行体操",items:[
{name:"その場足踏み",reps:"30秒 × 2回",desc:"背すじをのばし、腕を振って足踏みします。"},
{name:"体重移動",reps:"左右10回ずつ",desc:"壁や手すりにつかまり、左右へ体重をゆっくり移します。"},
{name:"前後ステップ",reps:"左右10回ずつ",desc:"手すりにつかまり、片脚を一歩前後に踏み出します。"}]}];
DEF.forEach(g=>g.items.forEach((it,i)=>{it.id=g.id+(i+1);it.url=""}));
let S={groups:DEF,log:{}},view="home",gid=null,edit=false,cm=new Date();cm.setDate(1);
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
let link="",copied=false;
try{const m=location.hash.match(/^#m=(.+)$/);if(m){const p=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(Array.isArray(p)&&p.length){S.groups=p;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}history.replaceState(null,"",location.pathname+location.search)}}}catch(e){}
const panel=()=>`<div class="item" style="margin-top:16px"><h3>患者さん用リンク</h3><p class="sub">「この患者さんに出す」にチェックした体操だけが入ったリンクを作ります。</p><button class="btn small" data-act="mk">リンクを作る</button>${link?`<textarea id="lk" rows="4" readonly>${esc(link)}</textarea><button class="btn ghost small" data-act="cp">${copied?'コピーしました':'コピー'}</button><p class="note">このリンクをLINEなどで患者さんに送ってください。開くと、選んだ体操だけが表示されます。</p>`:''}</div>`;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const raw=()=>S.groups.flatMap(g=>g.items);const all=()=>raw().filter(i=>i.on!==false);const vis=g=>edit?g.items:g.items.filter(i=>i.on!==false);
const done=(day)=>S.log[day]||[];
const isDone=(day,id)=>done(day).includes(id);
const allDone=day=>{const a=all();return a.length>0&&a.every(i=>isDone(day,i.id))};
const T=ds(new Date());
const MARU=(s=72,fill)=>`<svg class="bigmaru" width="${s}" height="${s}" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="28" fill="${fill?'var(--maru)':'none'}" fill-opacity=".12" stroke="var(--maru)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${fill?'':'4 12'}"/></svg>`;
function streak(){let n=0,d=new Date();if(!allDone(ds(d)))d.setDate(d.getDate()-1);while(allDone(ds(d))){n++;d.setDate(d.getDate()-1)}return n}
function video(it){const u=it.url.trim();if(!u)return`<div class="video">動画は準備中です</div>`;
if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return`<div class="video"><video controls playsinline preload="metadata" src="${esc(u)}"></video></div>`;
return`<div class="video"><a class="btn" href="${esc(u)}" target="_blank" rel="noopener">▶ 動画を見る</a></div>`}
function itemHTML(it){const on=isDone(T,it.id);
if(edit)return`<div class="item" style="${it.on===false?'opacity:.6':''}"><label class="sel"><input type="checkbox" data-act="sel" data-id="${it.id}" ${it.on!==false?'checked':''}> この患者さんに出す</label><label>体操名</label><input data-f="name" data-id="${it.id}" value="${esc(it.name)}"><label>回数・時間</label><input data-f="reps" data-id="${it.id}" value="${esc(it.reps)}"><label>やり方</label><textarea rows="2" data-f="desc" data-id="${it.id}">${esc(it.desc)}</textarea><label>動画のURL(YouTubeなど)</label><input data-f="url" data-id="${it.id}" value="${esc(it.url)}" placeholder="https://..."><button class="btn ghost small" data-act="del" data-id="${it.id}">この体操を削除</button></div>`;
return`<div class="item ${on?'done':''}"><h3>${esc(it.name)}</h3><p class="sub">${esc(it.reps)}</p>${video(it)}<p style="margin:0">${esc(it.desc)}</p><button class="check ${on?'on':''}" data-act="tog" data-id="${it.id}" aria-pressed="${on}">${on?'◯ できました':'今日やったら押す'}</button></div>`}
function home(){const a=all(),n=done(T).filter(id=>a.some(i=>i.id===id)).length,ok=allDone(T);
return`<h1>おうち体操</h1><p class="sub">${new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"long"})}</p>
<div class="today">${MARU(72,ok)}<div><b style="font-size:20px">${ok?'今日の体操は全部できました':'今日は '+n+' / '+a.length+' 完了'}</b><p class="sub">連続 ${streak()} 日</p></div></div>
<div class="grid">${S.groups.filter(g=>edit||vis(g).length).map(g=>{const c=g.items.filter(i=>i.on!==false&&isDone(T,i.id)).length,t=g.items.filter(i=>i.on!==false).length;return`<button class="tile" data-act="grp" data-id="${g.id}"><b>${esc(g.name)}</b><div><span class="sub">今日 ${c} / ${t}</span><div class="bar"><i style="width:${t?c/t*100:0}%"></i></div></div></button>`}).join("")}</div>
${S.groups.some(g=>vis(g).length)?'':'<p class="sub">まだ体操が設定されていません。担当の先生にご確認ください。</p>'}<div class="foot"><button data-act="edit">${edit?'編集を終わる':'先生用:体操・動画を編集'}</button></div>`}
function group(){const g=S.groups.find(x=>x.id===gid);
return`<button class="back" data-act="home">‹ 戻る</button><h2>${esc(g.name)}</h2>${vis(g).map(itemHTML).join("")||'<p class="sub">体操がまだありません。</p>'}
${edit?`<button class="btn small" data-act="add">+ 体操を追加</button>`:""}
<div class="foot"><button data-act="edit">${edit?'編集を終わる':'先生用:体操・動画を編集'}</button></div>`}
function calendar(){const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();let cells="";
["日","月","火","水","木","金","土"].forEach(w=>cells+=`<div class="h">${w}</div>`);
for(let i=0;i<first;i++)cells+="<div></div>";
for(let d=1;d<=dim;d++){const k=y+"-"+pad(m+1)+"-"+pad(d),c=done(k).length;
cells+=`<div class="d ${k===T?'t':''}"><span>${d}</span>${allDone(k)?MARU(34,true).replace('class="bigmaru"','style="margin-top:6px"'):c?`<small style="color:var(--maru);margin-top:8px">${c}</small>`:""}</div>`}
let mc=0;for(let d=1;d<=dim;d++)if(allDone(y+"-"+pad(m+1)+"-"+pad(d)))mc++;
return`<h2>きろく</h2><div class="stats"><div><b>${mc}</b><span class="sub">今月の丸</span></div><div><b>${streak()}</b><span class="sub">連続日数</span></div></div>
<div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn ghost small" data-act="pm">‹ 前月</button><b>${y}年${m+1}月</b><button class="btn ghost small" data-act="nm">次月 ›</button></div><div class="cal">${cells}</div>
<p class="note">全部の体操ができた日に丸がつきます。一部だけの日は数字が出ます。</p>`}
function nav(){const ic=p=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
document.getElementById("nav").innerHTML=`<button class="${view!=='cal'?'on':''}" data-act="home">${ic('<path d="M3 11l9-8 9 8v10H3z"/>')}体操</button><button class="${view==='cal'?'on':''}" data-act="cal">${ic('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>')}きろく</button>`}
function render(){const a=document.getElementById("app");a.innerHTML=(view==="cal"?calendar():view==="group"?group():home())+(edit&&view!=="cal"?panel():'')+'<div class="caution"><b>注意点</b>痛みが出る時は無理をせず、ご相談ください。</div>';nav();}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,id=b.dataset.id;
if(act==="home")view="home";
else if(act==="cal")view="cal";
else if(act==="grp"){view="group";gid=id}
else if(act==="tog"){const l=S.log[T]||(S.log[T]=[]),i=l.indexOf(id);i>=0?l.splice(i,1):l.push(id);save()}
else if(act==="edit")edit=!edit;
else if(act==="sel"){const it=raw().find(i=>i.id===id);it.on=it.on===false;save();link=""}
else if(act==="mk"){const p=S.groups.map(g=>({id:g.id,name:g.name,items:g.items.filter(i=>i.on!==false).map(i=>({id:i.id,name:i.name,reps:i.reps,desc:i.desc,url:i.url}))})).filter(g=>g.items.length);link=p.length?location.href.split("#")[0]+"#m="+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(p))))):"";copied=false}
else if(act==="cp"){try{navigator.clipboard.writeText(link)}catch(e){}copied=true}
else if(act==="add"){const g=S.groups.find(x=>x.id===gid);g.items.push({id:gid+Date.now(),name:"新しい体操",reps:"10回",desc:"",url:""});save()}
else if(act==="del"){const g=S.groups.find(x=>x.id===gid);g.items=g.items.filter(i=>i.id!==id);save()}
else if(act==="pm")cm.setMonth(cm.getMonth()-1);
else if(act==="nm")cm.setMonth(cm.getMonth()+1);
const y=window.scrollY;render();window.scrollTo(0,["tog","edit","add","del","sel","mk","cp"].includes(act)?y:0)});
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.f)return;const it=raw().find(i=>i.id===t.dataset.id);if(it){it[t.dataset.f]=t.value;save()}});
render();
</script>
</body>
</html>
